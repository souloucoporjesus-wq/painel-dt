<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dieta e Treino</title>
<style>
:root { --bg: #f4f6f3; --card: #ffffff; --ink: #1d2620; --muted: #5d6b62; --line: #dbe3dd; --accent: #1a7f4b; --erro: #b4231d; }
@media (prefers-color-scheme: dark) { :root { --bg: #111613; --card: #1a211c; --ink: #e6ece7; --muted: #9aa89f; --line: #2c362f; --accent: #3fb57a; --erro: #ff7b70; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
h1 { font-size: 20px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input[type=password] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px 14px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#msg { min-height: 1.2em; color: var(--erro); font-size: 14px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Dieta e Treino</h1>
  <p>Página protegida. Digite a senha para abrir.</p>
  <input type="text" name="username" value="painel" autocomplete="username" hidden>
  <input type="password" id="senha" autocomplete="current-password" aria-label="senha" required>
  <label><input type="checkbox" id="lembrar" checked> lembrar neste aparelho</label>
  <button id="abrir">Abrir</button>
  <div id="msg" role="status"></div>
</form>

const CHAVE_LOCAL = "painel-senha";
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const guardar = v => { try { v === null ? localStorage.removeItem(CHAVE_LOCAL) : localStorage.setItem(CHAVE_LOCAL, v); } catch (e) { /* sem armazenamento: pede a senha toda vez */ } };
const lida = () => { try { return localStorage.getItem(CHAVE_LOCAL); } catch (e) { return null; } };

async function abrir(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: deB64(D.sal), iterations: D.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(D.iv) }, k, deB64(D.dados));
  return new TextDecoder().decode(claro);
}
function mostrar(html) { document.open(); document.write(html); document.close(); }

const f = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("abrir");
f.addEventListener("submit", async ev => {
  ev.preventDefault();
  const senha = document.getElementById("senha").value;
  btn.disabled = true; msg.textContent = "";
  try {
    const html = await abrir(senha);
    guardar(document.getElementById("lembrar").checked ? senha : null);
    mostrar(html);
  } catch (e) {
    msg.textContent = window.isSecureContext ? "Senha não confere." : "Este navegador bloqueou a abertura (precisa de https).";
    btn.disabled = false;
  }
});
(async () => {
  const s = lida();
  if (!s) return;
  try { mostrar(await abrir(s)); } catch (e) { guardar(null); } // senha trocada: pede de novo
})();
</script>
